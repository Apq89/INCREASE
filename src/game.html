      <div class="chartwrap"><canvas id="assetChart" style="height:200px" aria-label="Evolução do preço"></canvas><div class="tip" hidden></div></div>
      <dl class="kv">
        <dt>Variação no período</dt><dd class="${sgn(chg(a.sym,ui.range))}">${spct(chg(a.sym,ui.range),1)}</dd>
        <dt>Volatilidade</dt><dd>${volLabel(a.vol)}</dd>
        ${a.type==='s' ? `<dt>Dividendo anual ${help('div')}</dt><dd>${a.div ? pct(a.div,1) : 'Não paga'}</dd>` : ''}
      </dl>
      ${o ? `<div class="bigpay" style="flex-wrap:wrap"><span>Tens ${qty(o.q)} ${a.sym}</span><span><strong class="num">${eurC(val)}</strong> <span class="num ${sgn(gain)}" style="font-size:14px">${gain>0?'+':''}${eurC(gain)} (${spct(gain/o.c,1)})</span></span></div>` : ''}
      <div class="trade">
        <div class="stack" style="gap:8px">
          <label class="eyebrow" for="buyAmt">Comprar por</label>
          <div style="display:flex;gap:8px;align-items:center"><input id="buyAmt" type="number" min="10" step="10" value="${Math.round(amt)}" inputmode="numeric"><span class="muted">€</span></div>
          <div class="quick">${[100,1000,10000].map(v=>`<button data-buyamt="${v}">${eur(v)}</button>`).join('')}<button data-buyamt="max">Tudo · ${eurC(Math.max(0,S.cash))}</button></div>
          <p class="note">${amt>=10 && S.cash>=10 ? `Recebes cerca de ${qty(Math.max(0,getQ))} ${a.sym}. Comissão: ${eur(fee)}.` : 'Mínimo de 10 €.'}${amt > S.cash && S.cash>=10 ? ' Vais comprar apenas com o saldo que tens.' : ''}</p>
          <button class="btn primary big" data-buyasset ${S.cash<10||amt<10?'disabled':''}>Comprar ${a.sym}</button>
        </div>
        <div class="stack" style="gap:8px">
          <span class="eyebrow">Vender</span>
          ${o ? `<div class="quick">${[[0.25,'25%'],[0.5,'50%']].map(([f,l])=>`<button data-sell="${f}">${l} · ${eurC(val*f)}</button>`).join('')}</div>
          <button class="btn big danger" data-sell="1">Vender tudo · ${eurC(val)}</button>` : '<p class="note">Ainda não tens este ativo.</p>'}
        </div>
      </div>
    </div></div>`;
  const h = S.mk[a.sym].h.slice(-ui.range-1);
  const pts = h.map((v,i)=>({t:dateOf(S.day-(h.length-1-i)), v}));
  lineChart($('assetChart'), pts, {fmt:eurP, axis:v=>eurP(v).replace(' €',''), color: chg(a.sym,ui.range)>=0 ? '--pos' : '--neg', left:70});
  if(fid){ const el = $(fid); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
}

/* ---------- Extrato ---------- */
function vExtrato(){
  if(!S.log.length) return `<section class="card"><h2>Extrato</h2><div class="empty">Sem movimentos. O primeiro será o teu primeiro crédito.</div></section>`;
  return `<section class="card"><div class="card-head"><h2>Extrato</h2><span class="note">Últimos ${S.log.length} movimentos</span></div>
    <div class="tbl"><table class="list ext"><thead><tr><th>Data</th><th>Descrição</th><th class="r">Movimento</th></tr></thead><tbody>
    ${S.log.slice(0,250).map(e=>`<tr class="${e.k}"><td class="d">${dateOf(e.d)}</td><td>${e.t}</td><td class="m ${e.a!=null?sgn(e.a):''}">${e.a!=null?(e.a>0?'+':'')+eur(e.a):''}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}

const VIEWS = {inicio:vInicio, banco:vBanco, negocios:vNegocios, imoveis:vImoveis, luxo:vLuxo, mercados:vMercados, extrato:vExtrato};

function renderView(){
  const a = document.activeElement, id = a && a.id && view.contains(a) ? a.id : null; let ss = null;
  try{ ss = a.selectionStart; }catch(e){}
  const openHelp = [...view.querySelectorAll('details.help[open]')].map(d=>[...view.querySelectorAll('details.help')].indexOf(d));
  view.innerHTML = VIEWS[ui.tab]();
  const all = view.querySelectorAll('details.help'); openHelp.forEach(i=>{ if(all[i]) all[i].open = true; });
  renderTabs();
  if(ui.tab==='inicio'){
    const pts = S.hist.concat([{d:S.day, nw:netWorth()}]).map(p=>({t:dateOf(p.d), v:p.nw}));
    if(pts.length < 2) pts.unshift({t:dateOf(0), v:pts[0].v});
    lineChart($('nwChart'), pts, {fmt:eurC, axis:v=>eurC(v).replace(' €','€'), zero:true});
  }
  if(ui.tab==='banco') updateSim();
  updateAffordable();
  if(id){ const el = $(id); if(el){ el.focus({preventScroll:true}); try{ if(ss!=null) el.setSelectionRange(ss,ss); }catch(e){} } }
  renderRestart();
  dirty = false;
  lastRender = performance.now();
}
function updateAffordable(){
  view.querySelectorAll('[data-cost]').forEach(b=>{ b.disabled = S.cash < +b.dataset.cost || S.cash <= 0; });
}
function renderRestart(){ $('restartSlot').innerHTML = btnConfirm('restart:1', 'Recomeçar jogo', 'danger'); }
function renderOverlay(){
  const o = $('overlay');
  if(S.over==='insolvencia'){
    o.hidden = false;
    o.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="ovT">
      <span class="eyebrow">${dateOf(S.day)}</span><div class="title-now neg" id="ovT">Insolvência</div>
      <p style="margin:0">O banco vendeu tudo o que tinhas e mesmo assim a conta ficou muito abaixo do limite do descoberto. O tribunal declarou-te insolvente.</p>
      <dl class="kv"><dt>Património máximo</dt><dd>${eurC(S.stats.peak)}</dd><dt>Juros pagos</dt><dd>${eurC(S.stats.interest)}</dd><dt>Dias de jogo</dt><dd>${S.day}</dd></dl>
      <button class="btn primary big" data-restart-now>Começar de novo</button></div>`;
  } else if(S.won && !S.wonSeen){
    o.hidden = false;
    o.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="ovT">
      <span class="eyebrow">${dateOf(S.day)}</span><div class="title-now" id="ovT">Lenda do crédito</div>
      <p style="margin:0">Mil milhões de euros de património líquido, construídos com dinheiro emprestado.</p>
      <dl class="kv"><dt>Dias de jogo</dt><dd>${S.day}</dd><dt>Juros pagos</dt><dd>${eurC(S.stats.interest)}</dd><dt>Prestações pagas</dt><dd>${S.stats.onTime}</dd></dl>
      <div style="display:flex;gap:8px"><button class="btn primary big" data-continue style="flex:1">Continuar a jogar</button><button class="btn big" data-restart-now>Novo jogo</button></div></div>`;
  } else { o.hidden = true; o.innerHTML = ''; }
}

/* ---------- Eventos ---------- */
let confirmTimer;
document.addEventListener('click', e=>{
  const back = e.target.closest('[data-close]');
  if(back && (e.target === back || back.classList.contains('x'))){ if(!S.cityChosen) return; ui.sheet = null; renderSheet(); return; }
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ ui.tab = d.tab; if(d.luxf) ui.luxf = d.luxf; ui.confirm = null; renderView(); window.scrollTo({top:0}); return; }
  if(d.speed !== undefined){ if(!S.over){ S.speed = +d.speed; if(S.speed>0) S.started = true; } refreshHeader(); if(ui.tab==='inicio') renderView(); return; }
  if(d.sel){ ui.sel = d.sel; ui.stamp = null; const pr = PROD_BY[d.sel]; const m = maxFor(pr, pr.terms[1]||pr.terms[0]); if(m>=500) ui.amount = Math.min(ui.amount, m); renderView(); return; }
  if(d.term){ ui.term = +d.term; ui.stamp = null; renderView(); return; }
  if(d.amt){ ui.amount = +d.amt; ui.stamp = null; renderView(); return; }
  if(d.bizf){ ui.bizf = d.bizf; ui.hireFor = null; renderView(); return; }
  if(d.hirefor !== undefined){ ui.hireFor = d.hirefor || null; ui.bizf = 'recrutar'; if(ui.hireFor) ensureCandidates(BIZ_BY[ui.hireFor].role, S.biz[ui.hireFor].city||'lisboa'); ui.tab = 'negocios'; renderView(); window.scrollTo({top:0}); return; }
  if(d.hire){ hire(+d.hire, d.biz, d.kind || 'efetivo'); act(); return; }
  if(d.contract){ ui.contract = d.contract; renderView(); return; }
  if(d.perm){ const [k, u] = d.perm.split('|'); makePermanent(k, +u); act(); return; }
  if(d.norenew){ const [k, u] = d.norenew.split('|'); toggleRenew(k, +u); act(); return; }
  if(d.work){ workHere(d.work); act(); return; }
  if(d.vehrepair){ vehRepair(+d.vehrepair); act(); return; }
  if(d.vehservice){ vehService(+d.vehservice); act(); return; }
  if(d.vehrestore){ vehRestore(+d.vehrestore); act(); return; }
  if(d.mkt){ ui.mkt = d.mkt; renderView(); return; }
  if(d.open){ ui.sheet = d.open; renderSheet(); return; }
  if(d.range){ ui.range = +d.range; renderSheet(); return; }
  if(d.buyamt){ ui.buyAmt = d.buyamt==='max' ? Math.floor(Math.max(0,S.cash)) : +d.buyamt; renderSheet(); return; }
  if('buyasset' in d){ buyAsset(ui.sheet, +ui.buyAmt); act(); return; }
  if(d.sell){ sellAsset(ui.sheet, +d.sell); act(); return; }
  if(t.id==='contract'){ takeLoan(); act(); return; }
  if(d.buyloan){ buyBizLoan(d.buyloan); act(); return; }
  if(d.buy){ buyBiz(d.buy); act(); return; }
  if(d.upg){ upgBiz(d.upg); act(); return; }
  if(d.buyprop){ buyProp(d.buyprop, d.mode, !!d.mort); act(); return; }
  if(d.mortterm){ ui.mortTerm = +d.mortterm; renderView(); return; }
  if('newsopen' in d){ ui.sheet = '@news'; renderSheet(); return; }
  if('cityopen' in d){ ui.sheet = '@city'; renderSheet(); return; }
  if(d.citysort){ ui.citySort = d.citysort; renderSheet(); return; }
  if(d.browse){ S.browse = d.browse; ui.sheet = null; ui.hireFor = null; act(); toast(`A ver preços de ${CITY_BY[d.browse].name}.`, '', CITY_BY[d.browse].flag); return; }
  if(d.move){ moveCity(d.move, false); ui.sheet = null; act(); return; }
  if(d.startcity){ S.city = S.browse = d.startcity; S.cityChosen = true; S.started = true; S.speed = 1; ui.sheet = null; log(`Começaste a vida em ${CITY_BY[d.startcity].name}: salário médio de ${eur(salaryNow())} e um quarto por ${eur(housingCost())}/mês.`, null, 'good'); act(); return; }
  if(d.luxf){ ui.luxf = d.luxf; renderView(); return; }
  if(d.carfuel !== undefined){ ui.carFuel = d.carfuel; ui.carN = 24; renderView(); return; }
  if(d.usedfuel !== undefined){ ui.usedFuel = d.usedfuel; renderView(); return; }
  if(d.carsort){ ui.carSort = d.carsort; renderView(); return; }
  if('carmore' in d){ ui.carN += 24; renderView(); return; }
  if(d.carterm){ ui.carTerm = +d.carterm; renderView(); return; }
  if(d.raise){ const [k, u] = d.raise.split('|'); acceptRaise(k, +u); act(); return; }
  if(d.noraise){ const [k, u] = d.noraise.split('|'); refuseRaise(k, +u); act(); return; }
  if(d.vehimp){ importVeh(+d.vehimp); act(); return; }
  if(d.buyvehimp){ const t = VEH_BY[d.buyvehimp], k = importCost(t, curYear(), 3, 1, carAt(), S.city), pr = vehPrice(t);
    if(S.cash < pr + k.total){ toast(`Precisas de ${eur(pr + k.total)} para comprar e importar.`, 'bad'); } else { buyVeh(d.buyvehimp); const v = S.veh[S.veh.length-1]; if(v) importVeh(v.uid); } act(); return; }
  if(d.carimp){ importCar(+d.carimp); act(); return; }
  if(d.carbuyimp){ const L = carMk().list.find(x=>x.uid===+d.carbuyimp); if(L){ const k = importCost(VEH_BY[L.m], L.year, L.cond, L.kmf, L.city, S.city); if(S.cash < L.ask + k.total){ toast(`Precisas de ${eur(L.ask + k.total)} para comprar e importar.`, 'bad'); } else { carBuyAt(L, L.ask); const c = S.cars[S.cars.length-1]; if(c) importCar(c.uid); } } act(); return; }
  if(d.carbuy){ carBuy(+d.carbuy, !!d.loan); act(); return; }
  if(d.caroffer){ carOffer(+d.caroffer, +d.f); act(); return; }
  if(d.carinsp){ carInspect(+d.carinsp); act(); return; }
  if(d.carfix){ carFix(+d.carfix); act(); return; }
  if(d.carlist){ carList(+d.carlist, +d.k); act(); return; }
  if(d.carunlist){ carUnlist(+d.carunlist); act(); return; }
  if(d.caraccept){ carAccept(+d.caraccept); act(); return; }
  if(d.cardecline){ carDecline(+d.cardecline); act(); return; }
  if(d.carkeep){ carKeep(+d.carkeep); act(); return; }
  if(d.vehsell){ vehToMarket(+d.vehsell); act(); return; }
  if(d.buyveh){ buyVeh(d.buyveh, !!d.loan); act(); return; }
  if(d.tvdedrive){ tvdeDrive(+d.tvdedrive); act(); return; }
  if(d.vehmode){ vehMode(+d.uid, d.vehmode); act(); return; }
  if(d.use){ setUse(+d.uid, d.use); act(); return; }
  if(d.payoff){ payoff(+d.payoff); act(); return; }
  if(d.amort){ const u = +d.amort; amortize(u, ui.amort[u] ?? Math.round((S.loans.find(l=>l.uid===u)?.balance||0)*0.1/100)*100, ui.amortMode[u] || 'pay'); act(); return; }
  if(d.amset){ const [u, v] = d.amset.split('|'); ui.amort[u] = +v; renderView(); return; }
  if(d.ammode){ const [u, m] = d.ammode.split('|'); ui.amortMode[u] = m; renderView(); return; }
  if(d.confirm){
    if(ui.confirm !== d.confirm){ ui.confirm = d.confirm; clearTimeout(confirmTimer); confirmTimer = setTimeout(()=>{ ui.confirm = null; renderView(); }, 3500); renderView(); return; }
    ui.confirm = null; const [k, v, w] = d.confirm.split(':');
    if(k==='fe') fire(v, +w);
    if(k==='sb') sellBiz(v); if(k==='sp') sellProp(+v); if(k==='sv') sellVeh(+v); if(k==='sc'){ const c = S.cars.find(x=>x.uid===+v); if(c) sellCar(c, carValue(c)*0.75, 'vendido a um stand'); }
    if(k==='restart'){ S = newState(); ui.tab = 'inicio'; ui.stamp = null; ui.sheet = '@city'; }
    act(); return;
  }
  if('restartNow' in d){ S = newState(); ui.tab = 'inicio'; ui.stamp = null; ui.sheet = '@city'; act(); return; }
  if('continue' in d){ S.wonSeen = true; S.speed = 1; act(); return; }
});
document.addEventListener('input', e=>{
  const id = e.target.id;
  if(id==='amt'){ ui.amount = +e.target.value || 0; ui.stamp = null; const r = $('amtR'); if(r) r.value = ui.amount; updateSim(); }
  if(id==='amtR'){ ui.amount = +e.target.value; ui.stamp = null; $('amt').value = ui.amount; updateSim(); }
  if(id==='mkq'){ ui.q = e.target.value; renderView(); }
  if(id==='hireRole'){ ui.hireRole = e.target.value; renderView(); }
  if(id==='cityq'){ ui.cityq = e.target.value; renderSheet(); }
  if(id==='craftq'){ ui.craftq = e.target.value; renderView(); }
  if(id==='carq'){ ui.carq = e.target.value; ui.carN = 24; renderView(); }
  if(id.startsWith('am-')){ ui.amort[id.slice(3)] = +e.target.value || 0; renderView(); }
  if(id==='propCity'){ S.browse = e.target.value; refreshHeader(); renderView(); }
  if(id==='carCity'){ S.carAt = isPT(e.target.value) ? null : e.target.value; ui.carN = 24; renderView(); }
  if(id==='carBrand'){ ui.carBrand = e.target.value; ui.carN = 24; renderView(); }
  if(id==='buyAmt'){ ui.buyAmt = +e.target.value || 0; renderSheet(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ui.sheet && S.cityChosen){ ui.sheet = null; renderSheet(); } });
function act(){ save(); refreshHeader(); renderView(); renderSheet(); renderOverlay(); }

/* ---------- Ciclo ---------- */
let acc = 0, last = performance.now(), lastSave = 0;
function frame(now){
  const dt = Math.max(0, (now-last)/1000); last = now;
  const blocked = S.over || (S.won && !S.wonSeen);
  if(!blocked && S.speed > 0){
    acc = Math.min(acc + dt*S.speed*DAY_RATE, 365); let n = 0;
    while(acc >= 1 && n < 40){ acc -= 1; tick(); n++; if(S.over || (S.won && !S.wonSeen)) break; }
    if(n){ refreshHeader(); updateAffordable(); if(S.over || (S.won && !S.wonSeen)) renderOverlay(); }
  } else acc = 0;
  const bar = $('dayBar'); if(bar) bar.style.width = (S.speed>0 ? Math.min(1,acc)*100 : 0).toFixed(1) + '%';
  if(now - lastSave > 15000){ lastSave = now; if(S.started) save(); }
  if(dirty && now - lastRender > 250){ renderView(); if(ui.sheet) renderSheet(); }
  renderTicker();
  requestAnimationFrame(frame);
}

// Tempo que passou enquanto o jogo esteve fechado (máximo 1 ano)
function catchUp(){
  if(!S.seen || S.speed <= 0 || S.over || (S.won && !S.wonSeen)) return;
  const days = Math.min(365, Math.floor((Date.now()-S.seen)/1000*S.speed*DAY_RATE));
  if(days < 1) return;
  const nw0 = netWorth(), box = $('toasts'); $('toasts').id = 'toasts-off';
  for(let i=0;i<days && !S.over && !(S.won && !S.wonSeen);i++) tick();
  box.id = 'toasts';
  save();
  const d = netWorth()-nw0;
  toast(`Enquanto estiveste fora passaram ${days} dias de jogo. Património ${d>=0?'+':'−'}${eurC(Math.abs(d))}. Vê o Extrato para os detalhes.`, d>=0?'good':'bad', '⏰');
}
function start(data){
  S = migrate(data && data.S) || load() || newState();
  if(data && data.ui) ui = Object.assign(ui, data.ui);
  catchUp();
  if(!S.cityChosen) ui.sheet = '@city';
  renderTicker(true);
  refreshHeader(); renderView(); renderSheet(); renderOverlay();
  let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ renderView(); if(ui.sheet) renderSheet(); }, 150); });
  const redraw = ()=>{ renderView(); if(ui.sheet) renderSheet(); };
  if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', redraw);
  new MutationObserver(redraw).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  window.claude?.hot?.snapshot?.(()=>({S, ui}));
  requestAnimationFrame(t=>{ last = t; requestAnimationFrame(frame); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
