<title>Increase</title>
<meta name="description" content="Jogo de negócios em que todo o capital vem de crédito bancário.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Russo+One&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap">
<style>
/* INCREASE — tema único de jogo, só preto, cinzas e branco */
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --surface:#151515; --surface-2:#222222; --ink:#F2F2F2; --muted:#999999; --line:#2E2E2E;
  --brand:#F2F2F2; --brand-ink:#0A0A0A; --accent:#FFFFFF; --accent-soft:#262626;
  /* só os ganhos e as perdas têm cor */
  --pos:#3DDC84; --neg:#FF5C5C; --warn:#C4C4C4; --pos-soft:#0F2A1C; --neg-soft:#3A1414; --warn-soft:#262626;
  --paper:#E8E8E4; --paper-ink:#101010; --paper-line:#B8B8B8; --news:"Old Standard TT", Georgia, "Times New Roman", serif;
  --sky:#3A3A3A; --gnd:#555555; --road:#2B2B2B; --sea:#6A6A6A; --sun:#D0D0D0; --sand:#8A8A8A;
  --s-rua:#9A9A9A; --s-restauracao:#8A8A8A; --s-servicos:#7A7A7A; --s-turismo:#A8A8A8; --s-industria:#6A6A6A; --s-retalho:#909090; --s-tecnologia:#B4B4B4; --s-saude:#A0A0A0; --s-financeiro:#848484; --s-desporto:#9C9C9C;
  --c1:#F2F2F2; --c2:#C4C4C4; --c3:#969696; --c4:#6E6E6E; --c5:#4E4E4E; --c6:#363636;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 28px -18px rgba(0,0,0,.9);
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --logo:"Russo One", "Chakra Petch", "Arial Black", sans-serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); margin:0}
table{font:inherit; color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

.app{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:14px 48px; display:flex; flex-direction:column; gap:14px}

/* Cabeçalho */
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.logo{font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.02em; line-height:1; color:var(--brand)}
.logo i{font-style:normal; color:var(--accent)}
.tagline{font-size:13px; color:var(--muted)}
.clock{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.clock .lbl{font-size:12px; color:var(--muted)}
.date{font-family:var(--mono); font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.date{position:relative; overflow:hidden}
.dayprog{position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--surface-2)}
#dayBar{display:block; height:100%; width:0; background:var(--accent)}
.speedhint{font-size:12px; color:var(--muted); flex-basis:100%; text-align:right}
.speed{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.speed button{border:0; background:transparent; padding:7px 12px; font-family:var(--mono); font-size:13px; border-right:1px solid var(--line); min-width:44px}
.speed button:last-child{border-right:0}
.speed button[aria-pressed="true"]{background:var(--brand); color:var(--brand-ink)}

/* Faixa de números */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.stat{padding:12px 16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px; min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.stat .v{font-family:var(--mono); font-size:20px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat .s{font-size:12px; color:var(--muted)}
.stat.score{flex-direction:row; align-items:center; gap:10px}
.gauge{width:78px; height:46px; flex:none}
.gauge .track{stroke:var(--surface-2)}
@media (max-width:560px){ .stat{border-right:0; border-bottom:1px solid var(--line); padding:10px 14px} .stat .v{font-size:18px} .stats{grid-template-columns:1fr 1fr} .stat.score{grid-column:1/-1} }

/* Navegação */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line)}
.tabs button{display:flex; align-items:center; gap:8px; border:0; background:transparent; padding:10px 14px; font-weight:600; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; position:relative}
.tabs svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tabs .badge{min-width:18px; padding:0 5px; border-radius:9px; background:var(--neg); color:#fff; font-size:11px; line-height:18px; text-align:center; font-family:var(--mono)}
@media (max-width:760px){
  .app{padding-bottom:96px}
  .tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); border-bottom:0; gap:0; padding-bottom:env(safe-area-inset-bottom, 0px); box-shadow:0 -8px 24px -18px rgba(0,0,0,.5)}
  .tabs button{flex:1; flex-direction:column; gap:2px; padding:8px 2px 9px; font-size:10.5px; border-bottom:0; border-top:2px solid transparent; margin:0; min-width:0}
  .tabs button[aria-selected="true"]{border-top-color:var(--accent); color:var(--brand)}
  .tabs .badge{position:absolute; top:4px; right:calc(50% - 22px); font-size:10px; line-height:16px; min-width:16px}
}

/* Genéricos */
h2{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin:0; text-wrap:balance}
h3{font-family:var(--display); font-weight:700; font-size:17px; margin:0; line-height:1.2; text-wrap:balance}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0}
.card-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:14px}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:9px 13px; font-weight:600; font-size:13.5px; white-space:nowrap; min-height:40px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--brand-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{color:var(--neg)}
.btn.confirm{background:var(--neg); border-color:var(--neg); color:#fff}
.btn.big{padding:13px 16px; font-size:15px}
.btn:disabled{opacity:.45}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.chip.pos{background:var(--pos-soft); color:var(--pos)} .chip.neg{background:var(--neg-soft); color:var(--neg)} .chip.warn{background:var(--warn-soft); color:var(--warn)}
.row{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
.kv{display:grid; grid-template-columns:1fr auto; gap:6px 16px; margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}
.kv .total{border-top:1px solid var(--line); padding-top:6px; font-weight:600; color:var(--ink)}
.note{font-size:13px; color:var(--muted); margin:0}
.bar{height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar > span{display:block; height:100%; background:var(--brand); border-radius:4px}
.empty{padding:22px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:10px; font-size:14px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:3px; background:var(--surface); gap:2px; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:7px 12px; border-radius:6px; font-weight:600; font-size:13px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.search{flex:1; min-width:160px; max-width:320px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit}
.big-n{font-family:var(--mono); font-size:20px; font-weight:600}
.metrics{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px}

/* Ajuda */
.help{display:inline-block; position:relative; vertical-align:middle; margin-left:4px}
.help summary{list-style:none; width:18px; height:18px; border-radius:50%; border:1px solid var(--line); font:600 11px var(--body); display:grid; place-items:center; cursor:pointer; color:var(--muted); background:var(--surface)}
.help summary::-webkit-details-marker{display:none}
.help[open] summary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.help p{position:absolute; z-index:25; top:24px; left:-8px; width:min(260px,72vw); background:var(--ink); color:var(--surface); padding:10px 12px; border-radius:8px; font-size:12.5px; line-height:1.45; margin:0; text-transform:none; letter-spacing:0; font-weight:400; box-shadow:var(--shadow)}

/* Gráficos */
.chartwrap{position:relative}
.chartwrap canvas{width:100%; height:240px; display:block; touch-action:pan-y}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--surface); border-radius:6px; padding:5px 8px; font-size:12px; display:flex; flex-direction:column; white-space:nowrap; transform:translate(-50%,-110%); z-index:3}
.tip .muted{color:inherit; opacity:.7}
.comp{display:flex; gap:2px; height:22px; border-radius:6px; overflow:hidden}
.comp span{display:block; min-width:3px}
.legend{display:grid; grid-template-columns:auto 1fr auto auto; gap:6px 10px; align-items:center; font-size:14px}
.legend i{width:10px; height:10px; border-radius:3px; display:block}

/* Início */
.g-home{display:grid; grid-template-columns:2fr 1fr; gap:14px}
.g-home .span2{grid-column:1/-1}
.g-home .chart-card{grid-row:span 2}
@media (max-width:860px){ .g-home{grid-template-columns:1fr} .g-home .chart-card{grid-row:auto} }
.title-now{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.02em; color:var(--accent); line-height:1.1}
.step{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; border-color:var(--accent); background:color-mix(in srgb, var(--accent-soft) 55%, var(--surface))}
.step .ico{width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:28px; background:var(--surface)}
.step.alert{border-color:var(--neg); background:var(--neg-soft)}
@media (max-width:560px){ .step{grid-template-columns:auto 1fr} .step .btn{grid-column:1/-1} }
.howto{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:14px}

/* Banco */
.g-bank{display:grid; grid-template-columns:1.05fr 1fr; gap:14px; align-items:start}
@media (max-width:900px){ .g-bank{grid-template-columns:1fr} }
.offers{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px}
.offer{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px}
.offer:hover{border-color:var(--muted)}
.offer[aria-pressed="true"]{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
.offer.shark[aria-pressed="true"]{border-color:var(--neg); box-shadow:inset 0 0 0 1px var(--neg)}
.offer.off{opacity:.62}
.offer .tan{font-family:var(--mono); font-size:22px; font-weight:600; line-height:1}
.offer .tan small{font-size:12px; color:var(--muted); font-weight:400; margin-left:4px}
.bank-logo{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font:800 14px var(--display); color:#fff; flex:none}
.sim{position:relative; overflow:hidden}
.sim .amount{display:flex; gap:8px; align-items:center}
.sim input[type=number], .sheet input[type=number]{flex:1; min-width:0; font:600 22px var(--mono); padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink)}
.sim input[type=range]{width:100%; accent-color:var(--brand)}
.quick{display:flex; flex-wrap:wrap; gap:6px}
.quick button, .terms button{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 11px; font-family:var(--mono); font-size:13px; min-height:36px}
.terms{display:flex; flex-wrap:wrap; gap:6px}
.terms button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.bigpay{display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding:12px; border-radius:10px; background:var(--surface-2)}
.bigpay .num{font-size:26px; font-weight:600}
.plain{font-size:14px; margin:0; padding:10px 12px; border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 8px 8px 0}
.warnbox{font-size:13px; padding:10px 12px; border-radius:8px; background:var(--neg-soft); color:var(--neg)}
.stamp{position:absolute; top:18px; right:14px; font-family:var(--display); font-weight:800; font-size:24px; letter-spacing:.08em; text-transform:uppercase; padding:4px 12px; border:3px double currentColor; border-radius:6px; transform:rotate(-9deg); pointer-events:none; text-align:center; line-height:1.1; background:var(--surface); opacity:.94; animation:stamp .38s cubic-bezier(.2,1.4,.4,1) both}
.stamp small{display:block; font-family:var(--mono); font-size:11px; letter-spacing:0; font-weight:500; text-transform:none}
.stamp.ok{color:var(--pos)} .stamp.no{color:var(--neg)}
@keyframes stamp{from{transform:rotate(-9deg) scale(2.2); opacity:0} to{transform:rotate(-9deg) scale(1); opacity:.94}}
.loans{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:10px}
.loan{border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px}
.loan.late{border-color:var(--neg)}

/* Arte */
.art{border-radius:10px; overflow:hidden; aspect-ratio:2/1.1; max-width:100%; position:relative}
.art svg{width:100%; height:100%; display:block}
.art .road{fill:var(--road)} .art .sky{fill:var(--sky)} .art .gnd{fill:var(--gnd)} .art .sea{fill:var(--sea)} .art .sun{fill:var(--sun)} .art .sand{fill:var(--sand)}
.bart{display:grid; place-items:center; background:radial-gradient(circle at 72% 28%, color-mix(in srgb, var(--sec) 38%, var(--surface)) 0 22%, transparent 23%), radial-gradient(circle at 18% 90%, color-mix(in srgb, var(--sec) 26%, var(--surface)) 0 30%, transparent 31%), color-mix(in srgb, var(--sec) 16%, var(--surface))}
.bart .emo{font-size:58px; line-height:1; filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.art .corner{position:absolute; top:8px; left:8px}
.art .corner2{position:absolute; top:8px; right:8px}

/* Negócios e imóveis */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.item{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 10px 14px; display:flex; flex-direction:column; gap:10px}
.item > .body{display:flex; flex-direction:column; gap:10px; padding-inline:4px; flex:1}
.item.owned{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
.item .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto}
.item .acts .btn{flex:1}
.item .seg{display:flex} .item .seg button{flex:1; font-size:12.5px; padding:7px 6px}
.lv{display:flex; gap:3px}
.lv span{width:16px; height:6px; border-radius:2px; background:var(--surface-2)}
.lv span.on{background:var(--accent)}
.summary-row{display:flex; flex-wrap:wrap; gap:10px 28px; align-items:baseline}
.summary-row .num{font-size:18px; font-weight:600}
.emps{display:flex; flex-direction:column; gap:6px; margin-top:6px}
.emp{display:flex; align-items:center; gap:8px}
.emp .nm2{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3}
.emp .nm2 strong{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px}
.emp .btn{min-height:32px; padding:5px 10px; font-size:12.5px}
.av{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font:700 12px var(--body); color:#fff; background:var(--muted); flex:none}
.av.me{background:var(--accent)}
.emp.vaga .av{background:var(--surface-2); color:var(--muted); border:1px dashed var(--muted)}
.stars{color:var(--accent); letter-spacing:1px; white-space:nowrap}
.citybtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; font-weight:600; font-size:13.5px; min-height:36px}
.citybar{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); font-size:13.5px}
.citybar .btn{margin-left:auto}
.cityrow{display:grid; grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(0,1fr)) auto; gap:10px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line)}
.cityrow.head{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); padding-top:0}
.cityrow .r{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap}
.cityrow .acts{display:flex; gap:6px; justify-content:flex-end}
.cityrow .btn{min-height:32px; padding:5px 9px; font-size:12.5px}
.cityrow.here{background:var(--accent-soft)}
@media (max-width:640px){ .cityrow{grid-template-columns:minmax(0,1fr) auto auto} .cityrow .hide-s{display:none} }
.ticker{display:flex; align-items:stretch; width:100%; padding:0; text-align:left; border:1px solid var(--paper-line); background:var(--paper); color:var(--paper-ink); border-radius:10px; overflow:hidden; min-height:40px}
.tk-label{flex:none; display:flex; flex-direction:column; justify-content:center; padding:0 12px; background:var(--neg); color:#fff; font:700 10.5px/1.2 var(--body); letter-spacing:.1em}
.tk-label small{font-weight:500; opacity:.85; letter-spacing:.04em}
.tk-track{flex:1; overflow:hidden; display:flex; align-items:center; min-width:0}
.tk-move{display:inline-flex; gap:48px; white-space:nowrap; padding-left:100%; animation:tk 70s linear infinite; font:700 15px var(--news)}
.tk-move b{font:700 10.5px var(--body); letter-spacing:.1em; text-transform:uppercase; color:var(--neg); margin-right:8px}
@keyframes tk{to{transform:translateX(-100%)}}
.ticker:hover .tk-move, .ticker:focus-visible .tk-move{animation-play-state:paused}
.paper{background:var(--paper); color:var(--paper-ink); border:1px solid var(--paper-line); border-radius:4px; padding:18px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; min-width:0}
.masthead{text-align:center; border-bottom:3px double var(--paper-ink); padding-bottom:8px}
.masthead .nm{font:400 42px/1 'UnifrakturMaguntia', var(--news)}
.masthead .sub{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font:500 10.5px var(--body); letter-spacing:.08em; text-transform:uppercase; border-top:1px solid var(--paper-ink); margin-top:8px; padding-top:5px}
.kicker{font:700 10.5px var(--body); letter-spacing:.12em; text-transform:uppercase; color:var(--neg)}
.lead h3{font:700 32px/1.08 var(--news); margin:4px 0 6px; text-wrap:balance}
.lead p{font:italic 400 16px/1.45 var(--news); margin:0}
.cols{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid var(--paper-ink)}
.cols article{padding:10px 12px; border-right:1px solid var(--paper-line); border-bottom:1px solid var(--paper-line)}
.cols article:nth-child(3n){border-right:0}
.cols h4{font:700 17px/1.2 var(--news); margin:3px 0 0; text-wrap:balance}
.paper .d{font:500 11px var(--mono); opacity:.65}
.paper .btn{align-self:center; background:transparent; color:var(--paper-ink); border-color:var(--paper-ink)}
.newslist article{padding:10px 0; border-bottom:1px solid var(--paper-line)}
.newslist h4{font:700 18px/1.25 var(--news); margin:2px 0 0}
.fresh{animation:fresh 1.5s ease-out}
@keyframes fresh{from{background:var(--accent-soft)}}

.tk{display:grid; place-items:center; width:40px; height:40px; border-radius:10px; background:var(--c); color:#fff; font:700 11px var(--mono); letter-spacing:-.02em; flex:none; text-align:center; line-height:1}

.mk-list{display:flex; flex-direction:column}
.mkrow{display:grid; grid-template-columns:minmax(0,1.6fr) 96px minmax(0,1fr) 78px minmax(0,1fr); gap:12px; align-items:center; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:10px 4px; width:100%}
.mkrow:hover{background:var(--surface-2)}
.mkrow:last-child{border-bottom:0}
.mkrow .who{display:flex; gap:10px; align-items:center; min-width:0}
.mkrow .nm{min-width:0; display:flex; flex-direction:column}
.mkrow .who strong{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mkrow .r{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.mkhead{display:grid; grid-template-columns:minmax(0,1.6fr) 96px minmax(0,1fr) 78px minmax(0,1fr); gap:12px; padding:0 4px 6px; border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted)}
.mkhead .r{text-align:right}
.spark{width:96px; height:30px; display:block}

.pill.pos{background:var(--pos-soft)} .pill.neg{background:var(--neg-soft)}
@media (max-width:640px){
  .mkrow, .mkhead{grid-template-columns:minmax(0,1fr) auto auto}
  .mkrow .spark, .mkrow .hold, .mkhead .hs, .mkhead .hh{display:none}
}

/* Folha de negociação */
.sheet-back{position:fixed; inset:0; background:rgba(5,12,9,.55); z-index:40; display:flex; align-items:center; justify-content:center; padding:16px}
.sheet{background:var(--surface); border-radius:16px; width:100%; max-width:640px; max-height:calc(100% - 32px); overflow:auto; padding:18px; display:flex; flex-direction:column; gap:14px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sheet .hd{display:flex; gap:12px; align-items:center}
.sheet .hd .x{margin-left:auto; border:1px solid var(--line); background:var(--surface); border-radius:50%; width:40px; height:40px; font-size:18px; flex:none}
.sheet .price{font-family:var(--mono); font-size:28px; font-weight:600; line-height:1.1}
.trade{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:560px){
  .sheet-back{align-items:flex-end; padding:0}
  .sheet{border-radius:16px 16px 0 0; max-height:92%; padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px))}
  .trade{grid-template-columns:1fr}
}

/* Extrato */
.tbl{overflow-x:auto; margin-inline:-16px; padding-inline:16px}
table.list{width:100%; border-collapse:collapse; font-size:14px}
table.list th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; text-align:left; padding:6px 10px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap}
table.list td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line); vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list .r{text-align:right}
.ext td.d{font-family:var(--mono); font-size:12.5px; color:var(--muted); white-space:nowrap}
.ext td.m{font-family:var(--mono); text-align:right; white-space:nowrap}
.ext tr.bad td:nth-child(2){color:var(--neg)}
.ext tr.good td:nth-child(2){color:var(--pos)}
.ext tr.evt td:nth-child(2){font-weight:600}

/* Avisos */
.toasts{position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); right:12px; z-index:50; display:flex; flex-direction:column; gap:8px; width:min(360px, calc(100% - 24px)); pointer-events:none}
.toast{pointer-events:auto; display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:10px; padding:10px 12px; box-shadow:0 14px 30px -14px rgba(0,0,0,.45); font-size:13.5px; animation:tin .25s ease-out both}
.toast.bad{border-left-color:var(--neg)} .toast.good{border-left-color:var(--pos)}
.toast .ti{font-size:18px; line-height:1.2}
@keyframes tin{from{transform:translateY(-8px); opacity:0}}

/* Sobreposição */
.overlay{position:fixed; inset:0; background:rgba(5,12,9,.6); display:grid; place-items:center; padding:16px; z-index:60}
.overlay .card{max-width:440px; width:100%; box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.overlay .title-now{font-size:32px}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding-top:6px}

// Distância em linha reta entre duas cidades portuguesas (km)
function distKm(a, b){
  const A = COORDS[a||'lisboa'], B = COORDS[b||'lisboa']; if(!A || !B) return 99999;
  const r = Math.PI/180, dLa = (B[0]-A[0])*r, dLo = (B[1]-A[1])*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(A[0]*r)*Math.cos(B[0]*r)*Math.sin(dLo/2)**2;
  return Math.round(12742*Math.asin(Math.sqrt(h)));
}

function mkCar([brand, model, fuel, kind, price, since], classic){
  const id = 'car_' + (brand + '_' + model).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_');
  const dep = classic ? -0.03 : kind==='super' ? .07 : price>150000 ? .08 : FUEL[fuel].dep;
  const upkeep = Math.round(classic ? 60 + price*0.003 : (40 + price*0.004) * (fuel==='E' ? 0.7 : 1));
  let earn = 0, rentAs = '';
  if(classic){ earn = Math.round(price*0.012); rentAs = 'Aluguer para casamentos'; }
  else if(kind==='sports' || kind==='super'){ earn = Math.round(price*0.018); rentAs = 'Experiências de condução'; }
  else if(price <= 60000){ earn = Math.round((300 + price*0.015) * (fuel==='E' ? 1.2 : 1)); rentAs = fuel==='E' ? 'TVDE elétrico' : 'TVDE'; }
  else if(price >= 90000){ earn = Math.round(price*0.02); rentAs = 'Serviço de motorista'; }
  const prest = Math.round(Math.max(1, Math.pow(price/1000, 0.85)/1.6) * (classic ? 1.5 : 1));
  return {id, cat:'carro', brand, model, name:`${brand} ${model}`, fuel, kind, price, since, dep, upkeep, earn, rentAs, prest, classic:!!classic, col:CAR_COLS[hashStr(id) % CAR_COLS.length]};
}

function genHist(a){
  const h = [a.p]; let p = a.p; const sd = a.vol/Math.sqrt(365), mu = (a.type==='c'?0.12:0.07)/365;
  for(let i=0;i<179;i++){ p = p/Math.exp(gauss()*sd + mu); h.push(p); }
  return h.reverse();
}

function migrate(s){
  if(!s) return null;
  if(s.v===1){ s.v = 2; s.hold = {}; s.stats.div = 0; s.stats.realized = 0; }
  if(s.v===2){ s.v = 3; s.veh = []; (s.props||[]).forEach(p=>{ p.use = p.use || 'arrendar'; }); }
  if(s.v===3){
    s.v = 4; s.workAt = null;
    for(const id in s.biz){ const b = BIZ_BY[id]; s.biz[id].staff = Array.from({length:b.slots}, ()=>({uid:s.uid++, name:randName(), skill:3, sal:ROLES[b.role].s, since:s.day})); }
    (s.veh||[]).forEach(v=>{ v.cond = 3; v.svc = s.day; });
  }
  if(s.v===4){
    s.v = 5; s.city = 'lisboa'; s.browse = 'lisboa'; s.cityChosen = true;
    (s.props||[]).forEach(p=>{ const L = LEGACY_PROPS[p.id] || ['t1',650,'lisboa']; p.id = L[0]; p.rent0 = L[1]*(s.housing||1); p.h0 = s.housing||1; p.city = L[2]; });
    const home = (s.props||[]).find(p=>p.use==='morar'); if(home) s.city = s.browse = home.city;
    for(const id in s.biz) s.biz[id].city = 'lisboa';
    (s.cars||[]).forEach(c=>{ c.city = c.city || 'lisboa'; });
    if(s.hire) s.hire.list.forEach(c=>{ c.city = c.city || 'lisboa'; });
    if(s.carMk && s.carMk.list){ s.carMk.list.forEach(L=>{ L.city = 'lisboa'; }); s.carMk = {lisboa:{list:s.carMk.list}}; }
    if(s.workAt && s.city!=='lisboa') s.workAt = null;
  }
  if(s.v!==5) return null;
  (s.props||[]).forEach(p=>{ if(p.id==='ilha' && !(CITY_FEAT[p.city]||'').includes('i')) p.city = 'miami'; });
  if(!CITY_BY[s.city] || CITY_BY[s.city].country!=='Portugal') s.city = 'lisboa';
  if(!CITY_BY[s.browse] || CITY_BY[s.browse].country!=='Portugal') s.browse = s.city; if(!CITY_BY[s.browse]) s.browse = s.city;
  for(const id in s.biz){ s.biz[id].staff = s.biz[id].staff || []; s.biz[id].staff.forEach(e=>{ if(!e.contract) e.contract = 'efetivo'; if(e.sal < MIN_WAGE) e.sal = MIN_WAGE; if(e.raise && e.raise < MIN_WAGE) e.raise = MIN_WAGE; }); }
  if(s.hire) s.hire.list.forEach(c=>{ if(c.sal < MIN_WAGE) c.sal = MIN_WAGE; });
  s.veh = s.veh || [];
  s.cars = s.cars || [];
  if(s.cityChosen && !s.over) { s.speed = 1; s.started = true; }
  s.mk = initMarkets(s.mk || {});
  s.hold = s.hold || {};
  return s;
}

function eur(v){ return (v<0?'−':'') + nf0.format(Math.round(Math.abs(v))) + ' €'; }
function eurC(v){
  const a = Math.abs(v), s = v<0?'−':'';
  if(a>=1e9) return s + nf2.format(a/1e9) + ' mM€';

}

function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));

function monthsIn(e){ return Math.max(0, Math.floor((S.day - (e.since ?? S.day))/30)); }
function empProd(e){ return SKILL[e.skill].p*(1 + Math.min(0.2, monthsIn(e)*0.005)); }

// Cada pessoa a trabalhar fatura 1,5 vezes o salário da profissão; tu faturas pelo menos 1,3 salários médios da cidade.

const LABOR = 1.5;

function bizDaily(id){
  const o = S.biz[id], b = BIZ_BY[id], city = o.city||'lisboa', rs = roleSalAt(b, city);

  if(S.workAt===id) work += ownerPayFor(b, city)*ownerExp(o);
  const base = b.day*(1 + 0.7*(o.lvl-1))*CITY_BY[city].col*30*staffRatio(id);

function pName(p){ return propName(PROP_BY[p.id], p.city); }
function propPrice(t, city){ return (t.island ? 40000000*CITY_BY[city].col : t.m2*CITY_BY[city].m2*t.pf) * S.housing; }
function propRentOf(t, city){ return t.island ? propPrice(t, city)*0.003 : CITY_BY[city].rent1*Math.pow(t.m2/50, 0.85)*t.rf*S.housing; }

function jobSalary(){ return CITY_BY[S.city].sal; }
// Quem trabalha no próprio negócio deixa o emprego e deixa de receber salário
function salaryNow(){ return S.workAt ? 0 : jobSalary(); }

function vehPrice(t, city=carAt()){ return t.cat==='carro' && !t.legacy ? t.price*CITY_BY[city].car : t.price; }
function homeProp(){ return S.props.find(p=>p.use==='morar'); }
function homePrest(p){ return Math.round(Math.sqrt(p.value)/10); }

function isTvde(t){ return /TVDE/.test(t.rentAs || ''); }
// TVDE: as corridas faturam ~2,2 salários médios da cidade por mês (+15% em carros acima de 40 000 €).
// Energia: elétrico 8%, híbrido 15%, gasolina/gasóleo 22%. Com motorista contratado, ele fica com 60%.
function tvdeEarn(t, city, iDrive){
  const R = 2.2*CITY_BY[city || 'lisboa'].sal*(t.price > 40000 ? 1.15 : 1);
  const energy = t.fuel==='E' ? 0.08 : (t.fuel==='H' || t.fuel==='P') ? 0.15 : 0.22;

function tvdeDrive(uid){

  const t = VEH_BY[v.id]; if(!isTvde(t)) return;
  if(drivesThis(v)){ S.workAt = null; log(`Deixaste de conduzir TVDE e voltaste ao emprego (${eur(jobSalary())}/mês)`); toast(`Voltaste ao emprego. O ${t.name} fica com um motorista contratado.`, '', '💼'); return; }

function vehEarn(){ return S.veh.reduce((t,v)=>t+vehEarnOne(v),0); }
function prestige(){ let p = 0; for(const v of S.veh) if(v.mode!=='render' && !v.broken) p += VEH_BY[v.id].prest; const h = homeProp(); if(h) p += homePrest(h); return p; }
function prestigeMult(){ return 1 + Math.min(0.25, prestige()/4000); }
function prestIdx(p){ let i=0; PRESTIGE.forEach((x,k)=>{ if(p>=x.p) i=k; }); return i; }
function propTotal(){ return S.props.reduce((t,p)=>t+p.value,0); }
function rentsMonthly(){ return S.props.reduce((t,p)=>t+propRent(p),0); }
function price(sym){ const h = S.mk[sym].h; return h[h.length-1]; }
function chg(sym, days){ const h = S.mk[sym].h; const i = Math.max(0, h.length-1-days); return h[h.length-1]/h[i] - 1; }
function holdValue(sym){ const o = S.hold[sym]; return o ? o.q*price(sym) : 0; }
function stocksValue(){ let t=0; for(const s in S.hold) if(A_BY[s].type==='s') t += holdValue(s); return t; }
function cryptoValue(){ let t=0; for(const s in S.hold) if(A_BY[s].type==='c') t += holdValue(s); return t; }
function monthlyIncome(){ return salaryNow() + bizMonthly() - staffCost() + rentsMonthly() + vehEarn(); }
function debtService(){ return S.loans.reduce((t,L)=>t+L.pay,0); }
function debt(){ return S.loans.reduce((t,L)=>t+L.balance,0); }
function netWorth(){ return S.cash + bizTotalValue() + propTotal() + stocksValue() + cryptoValue() + vehValue() + carsValue() - debt(); }
function monthlyFlow(){ return monthlyIncome() - livingCost() - vehUpkeep() - debtService(); }
function titleIdx(nw){ let i=0; TITLES.forEach((t,k)=>{ if(nw>=t.nw) i=k; }); return i; }
function outstanding(pid){ return S.loans.filter(L=>L.pid===pid).reduce((t,L)=>t+L.balance,0); }
function scoreBand(s){ return s>=740?['Excelente','pos']: s>=670?['Bom','pos']: s>=580?['Razoável','warn']:['Fraco','neg']; }
function volLabel(v){ return v<.25?'Baixa': v<.45?'Média': v<1?'Alta':'Extrema'; }

function prodReason(p){
  const r = p.req(); if(r) return r;
  if(S.score < p.minScore) return `Precisas de score ${p.minScore} ou mais.`;
  if(!p.shark && S.cash < 0) return 'Os bancos não emprestam a contas a descoberto.';
  if(!p.shark && S.loans.some(L=>!PROD_BY[L.pid].shark && L.missed>0)) return 'Tens prestações em atraso noutro banco.';
  return null;
}
function hasBiz(){ return Object.keys(S.biz).length > 0; }
function maxFor(p, term){
  if(prodReason(p)) return 0;
  let avail = p.cap() - outstanding(p.id);
  if(p.business && hasBiz()){
    // O banco olha para a capacidade das empresas: prestações empresariais até 70% do lucro dos negócios
    const room = 0.7*Math.max(0, bizMonthly()-staffCost()) - S.loans.filter(L=>L.pid==='empresa').reduce((t,L)=>t+L.pay,0);
    if(room <= 0) return 0;
    avail = Math.min(avail, pv(room, p.rate(), term));
  } else if(!p.shark){
    const room = 0.6*monthlyIncome() - debtService();
    if(room <= 0) return 0;
    avail = Math.min(avail, pv(room, p.rate(), term));
  }
  return Math.max(0, Math.floor(avail/100)*100);
}

   AÇÕES DO JOGADOR

function takeLoan(){
  const p = PROD_BY[ui.sel], term = ui.term, amount = Math.floor(ui.amount);
  const reason = prodReason(p), max = maxFor(p, term);
  if(reason || amount < 500 || amount > max){
    ui.stamp = {ok:false, sub: reason || (amount<500 ? 'Mínimo de 500 €' : `Máximo de ${eur(max)} a ${term} meses`)};
    return;
  }
  const rate = p.rate();
  S.loans.push({uid:S.uid++, pid:p.id, principal:amount, balance:amount, rate, term, left:term, pay:pmt(amount,rate,term), due:S.day+30, missed:0, start:S.day});
  S.cash += amount;
  if(!p.shark) S.score = clamp(S.score-4, 300, 850);
  log(`${p.name} · ${p.bank} (${term} meses, TAN ${pct(rate)})`, amount, 'in');
  ui.stamp = {ok:true, sub:`${eur(amount)} a ${term} meses`};
  toast(`Crédito aprovado: ${eur(amount)} já estão na tua conta.`, 'good', '🏦');
  if(!S.started){ S.started = true; S.speed = 1; }
}
function payoff(uid){
  const L = S.loans.find(l=>l.uid===uid); if(!L) return;
  const shark = PROD_BY[L.pid].shark, total = L.balance * (shark?1:1.005);
  if(S.cash < total) return;
  S.cash -= total; S.loans = S.loans.filter(l=>l!==L);
  if(!shark) S.score = clamp(S.score+8, 300, 850);
  log(`Liquidação antecipada · ${PROD_BY[L.pid].name}`, -total, 'good');
}
// Amortização parcial: escolhes o valor e se queres baixar a prestação ou encurtar o prazo
function amortFee(L){ return PROD_BY[L.pid].shark ? 0 : 0.005; }
function amortResult(L, amount, mode){
  const bal = L.balance - amount;
  if(bal < 1) return {bal:0, pay:0, left:0};
  if(mode==='term'){ const r = L.rate/1200; const left = Math.max(1, Math.ceil(r ? -Math.log(1 - r*bal/L.pay)/Math.log(1+r) : bal/L.pay)); return {bal, pay:L.pay, left}; }
  return {bal, pay:pmt(bal, L.rate, Math.max(1, L.left)), left:L.left};
}
function amortize(uid, amount, mode='pay'){
  const L = S.loans.find(l=>l.uid===uid); if(!L) return;
  amount = Math.min(Math.max(0, +amount || 0), L.balance);
  if(amount < 100){ toast('O valor mínimo para amortizar é 100 €.', 'bad'); return; }
  const cost = amount*(1 + amortFee(L));
  if(S.cash < cost){ toast(`Precisas de ${eur(cost)} (inclui ${pct(amortFee(L)*100,1)} de comissão).`, 'bad'); return; }
  const res = amortResult(L, amount, mode);
  S.cash -= cost;
  if(res.bal < 1){ S.loans = S.loans.filter(l=>l!==L); log(`Liquidação antecipada · ${PROD_BY[L.pid].name}`, -cost, 'good'); toast('Crédito liquidado.', 'good', '🎉'); return; }
  const before = {pay:L.pay, left:L.left};
  L.balance = res.bal; L.pay = res.pay; L.left = res.left;
  delete ui.amort[uid];
  log(`Amortização de ${eur(amount)} · ${PROD_BY[L.pid].name} (${mode==='term' ? `prazo de ${before.left} para ${L.left} meses` : `prestação de ${eur(before.pay)} para ${eur(L.pay)}`})`, -cost);
  toast(mode==='term' ? `Amortizaste ${eur(amount)}. Acabas de pagar ${before.left - L.left} meses mais cedo.` : `Amortizaste ${eur(amount)}. A prestação baixou para ${eur(L.pay)}.`, 'good', '📉');
}
// Financiar a compra de um negócio: 70% emprestado, analisado pelo lucro previsto desse negócio com a equipa toda
function bizLoanQuote(b, city=S.browse){
  const P = PROD_BY.empresa, cost = bizCost(b, city), loan = Math.round(cost*0.7/100)*100, term = 84, rate = P.rate(), pay = pmt(loan, rate, term);
  const profit = shopProfit(b, city, false) + Math.max(0, bizMonthly()-staffCost());
  const existing = S.loans.filter(L=>L.pid==='empresa').reduce((t,L)=>t+L.pay,0);
  let reason = null;
  if(S.score < P.minScore) reason = `O banco pede score ${P.minScore} ou mais.`;
  else if(S.cash < 0) reason = 'Os bancos não emprestam a contas a descoberto.';
  else if(S.loans.some(L=>!PROD_BY[L.pid].shark && L.missed>0)) reason = 'Tens prestações em atraso.';
  else if(existing + pay > 0.7*profit) reason = 'O lucro previsto não chega para a prestação.';
  return {loan, rate, pay, term, down:cost - loan, reason};
}
function buyBizLoan(id){

  S.cash += q.loan; buyBiz(id);
  if(!findBiz(b.id, S.browse)){ S.cash -= q.loan; return; }
  S.loans.push({uid:S.uid++, pid:'empresa', principal:q.loan, balance:q.loan, rate:q.rate, term:q.term, left:q.term, pay:q.pay, due:S.day+30, missed:0, start:S.day});

  log(`Crédito empresarial: ${eur(q.loan)} para comprar ${b.name} (${q.term} meses, TAN ${pct(q.rate)})`);
}
function buyBiz(id){

function mortgageQuote(t, city, mode){
  const P = PROD_BY.habitacao, pr = propPrice(t, city), loan = Math.round(pr*(mode==='morar' ? 0.9 : 0.8)/100)*100, rate = P.rate(), pay = pmt(loan, rate, ui.mortTerm);

function buyProp(id, mode='arrendar', mort=false){

function bizCities(){ const c = [...new Set(Object.values(S.biz).map(o=>o.city||'lisboa'))]; return c.length ? c : [S.city]; }

function carLoanQuote(price, city=carAt()){

/* ---------- Mercado de carros usados ---------- */
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function curYear(){ return new Date(2026,0,1+S.day).getFullYear(); }
function usedValue(t, year, cond, kmf, city='lisboa'){
  const f = t.classic ? Math.pow(1.03, curYear()-2026) : Math.pow(1-t.dep, Math.max(0.5, curYear()-year));
  return t.price * CITY_BY[city || 'lisboa'].car * f * CONDS[cond].f * kmf * S.market;
}
function carValue(c){ return usedValue(VEH_BY[c.m], c.year, c.cond, c.kmf, c.city); }
function carsValue(){ return (S.cars||[]).reduce((t,c)=>t+carValue(c),0); }
function carFixCost(c){ return c.cond>=3 ? 0 : (usedValue(VEH_BY[c.m], c.year, c.cond+1, c.kmf, c.city) - carValue(c)) * (c.cond===2 ? 0.6 : 0.55); }
function carDayChance(c){ return c.listed ? clamp(0.3*(1.2 - c.listed/carValue(c))/0.4, 0, 0.3) : 0; }
function carMk(city=carAt()){
  if(!S.carMk) S.carMk = {};
  if(S.carMk.list) S.carMk = {lisboa:{list:S.carMk.list}};

function newListing(city=carAt()){
  const cap = Math.max(35000, netWorth()*0.6);

  if(Math.random() < 0.07 || !pool.length) pool = CARS;
  const t = pool[Math.floor(Math.random()*pool.length)], cy = curYear();
  const year = t.classic ? t.since : Math.max(t.since, cy - 1 - Math.floor(Math.random()*Math.min(15, Math.max(1, cy - t.since))));
  const age = Math.max(0.5, cy - year), kmf = 0.9 + Math.random()*0.2;
  const km = t.classic ? Math.round(40 + Math.random()*140)*1000 : Math.round(age*(22000 - (kmf-0.9)*70000)/100)*100;
  const r = Math.random(), cond = r<0.18 ? 0 : r<0.45 ? 1 : r<0.82 ? 2 : 3;
  let claim = cond; if(cond<3 && Math.random()<0.3) claim = Math.min(3, cond + 1 + (Math.random()<0.3 ? 1 : 0));
  const ask = Math.max(300, Math.round(usedValue(t, year, claim, kmf, city)*(0.82 + Math.random()*0.36)/50)*50);
  return {uid:S.uid++, city, m:t.id, year, km, kmf, cond, claim, col:CAR_COLS[Math.floor(Math.random()*CAR_COLS.length)], seller:SELLERS[Math.floor(Math.random()*SELLERS.length)],
    ask, min:Math.round(ask*(0.8+Math.random()*0.15)), exp:S.day + 5 + Math.floor(Math.random()*14), insp:false, offered:-1, note:''};
}
function carMarketDay(){
  carMk();
  for(const city in S.carMk){
    const mk = S.carMk[city];
    mk.list = mk.list.filter(x=>x.exp > S.day);
    if(mk.list.length < 14 && Math.random() < 0.5) mk.list.push(newListing(city));
  }
  for(const c of [...S.cars]){
    if(c.offer && c.offer.exp <= S.day) c.offer = null;
    if(!c.listed) continue;
    if(Math.random() < carDayChance(c)){ sellCar(c, c.listed, 'um comprador pagou o preço pedido'); dirty = true; continue; }
    if(!c.offer && Math.random() < 0.12){
      const amt = Math.round(carValue(c)*(0.85+Math.random()*0.15)/50)*50;
      if(amt < c.listed){ c.offer = {amt, exp:S.day+3}; dirty = true; toast(`Proposta pelo teu ${VEH_BY[c.m].name}: ${eur(amt)}. Responde em Garagem › Usados.`, '', '💬'); }
    }
  }
}
function carBuyAt(L, price, withLoan=false){
  let q = null;
  if(withLoan){ q = carLoanQuote(price, L.city||'lisboa'); if(q.reason){ toast(q.reason, 'bad', '🏦'); return; } if(S.cash < q.down){ toast(`Precisas de ${eur(q.down)} de entrada.`, 'bad'); return; } S.cash += q.loan; }
  if(S.cash < price){ if(q) S.cash -= q.loan; toast('Não tens dinheiro suficiente para este carro.', 'bad'); return; }
  const t = VEH_BY[L.m];
  const mk = carMk(L.city || 'lisboa'); S.cash -= price; mk.list = mk.list.filter(x=>x!==L);
  S.cars.push({uid:S.uid++, city:L.city || 'lisboa', m:L.m, year:L.year, km:L.km, kmf:L.kmf, cond:L.cond, col:L.col, paid:price, spent:0, listed:null, offer:null, since:S.day});
  log(`Compra em segunda mão: ${t.name} de ${L.year} (${L.seller})`, -price);
  if(q) addCarLoan(q, {car:S.cars[S.cars.length-1].uid}, t.name);
  if(!L.insp && L.claim > L.cond) toast(`Surpresa: o ${t.name} afinal está "${CONDS[L.cond].n}" e não "${CONDS[L.claim].n}".`, 'bad', '😬');
  else toast(`Compraste o ${t.name} de ${L.year}. Estado: ${CONDS[L.cond].n}.`, 'good', '🚗');
  if(!S.started){ S.started = true; S.speed = 1; }
}

const EUROPE = new Set(['Portugal','Espanha','França','Mónaco','Reino Unido','Irlanda','Alemanha','Países Baixos','Bélgica','Luxemburgo','Suíça','Áustria','Itália','Grécia','Noruega','Suécia','Dinamarca','Finlândia','Polónia','Chéquia','Hungria','Roménia','Turquia']);
const NON_EU = new Set(['Reino Unido','Suíça','Noruega','Turquia']);
const inEU = country=>EUROPE.has(country) && !NON_EU.has(country);
// Custos de trazer um carro da cidade onde está para outra: transporte, impostos e legalização
function importCost(t, year, cond, kmf, fromCity, dest){
  const from = CITY_BY[fromCity || 'lisboa'], to = CITY_BY[dest];
  const valueDest = usedValue(t, year, cond, kmf, dest);
  const sameCountry = from.country===to.country;
  const transport = sameCountry ? 400 : (EUROPE.has(from.country) && EUROPE.has(to.country)) ? 1200 : 3500;
  let rate = 0, taxName = '';
  if(sameCountry) rate = 0;
  else if(to.country==='Portugal'){ rate = t.fuel==='E' ? 0 : (t.fuel==='H' || t.fuel==='P') ? 0.05 : (curYear()-year > 10 ? 0.06 : 0.12); taxName = 'ISV'; }
  else if(inEU(from.country) && inEU(to.country)) rate = 0.02;
  else { rate = 0.05 + Math.max(0, to.car - 1)*0.8; taxName = 'direitos alfandegários'; }
  const legal = sameCountry ? 0 : to.country==='Portugal' ? 350 : 250;
  const tax = valueDest*rate;
  return {transport, tax, legal, total:transport + tax + legal, valueDest, taxName: taxName || 'impostos'};
}
function importCar(uid, dest=S.city){
  const c = S.cars.find(x=>x.uid===uid); if(!c || sameCountry(c.city, dest)) return;
  const t = VEH_BY[c.m], k = importCost(t, c.year, c.cond, c.kmf, c.city, dest);
  if(S.cash < k.total){ toast(`A importação custa ${eur(k.total)}.`, 'bad'); return; }
  S.cash -= k.total; c.spent += k.total; const from = ctry(c.city); c.city = dest; c.listed = null; c.offer = null;
  log(`Importação do ${t.name} de ${from} para ${ctry(dest)}: transporte ${eur(k.transport)}, ${k.taxName} ${eur(k.tax)}, legalização ${eur(k.legal)}`, -k.total);
  toast(`O ${t.name} chegou a ${ctry(dest)}. Vale lá cerca de ${eur(carValue(c))}.`, 'good', '🚢');
}
// Botão de importação com a comparação: quanto custa trazer o carro e quanto vale no destino
// price: preço de compra (0 se o carro já é teu); opts.here: quanto vale onde está; opts.localNew: preço de um novo no destino
function importBtn(t, year, cond, kmf, fromCity, attr, label, price=0, opts={}){
  const k = importCost(t, year, cond, kmf, fromCity, S.city), dest = ctry(S.city), from = ctry(fromCity);
  const ref = opts.localNew ?? k.valueDest;
  const diff = price > 0 ? ref - (price + k.total) : ref - k.total - (opts.here || 0);
  return `<div style="border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px">
    <dl class="kv" style="font-size:13px">
      ${price > 0 ? `<dt>Preço em ${from}</dt><dd>${eur(price)}</dd>` : `<dt>Vale em ${from}</dt><dd>${eur(opts.here || 0)}</dd>`}
      <dt>Transporte</dt><dd>${eur(k.transport)}</dd><dt>${k.taxName}</dt><dd>${eur(k.tax)}</dd><dt>Legalização</dt><dd>${eur(k.legal)}</dd>
      ${price > 0 ? `<dt class="total">Total posto em ${dest}</dt><dd class="total">${eur(price + k.total)}</dd>` : ''}
      <dt>${opts.localNew ? `Novo em ${dest} custa` : `Vale em ${dest}`}</dt><dd><strong>${eur(ref)}</strong></dd>
    </dl>
    <span class="note" style="color:var(--${diff >= 0 ? 'pos' : 'neg'})">${diff >= 0 ? `✅ Compensa: ${price > 0 ? 'poupas' : 'ganhas'} cerca de ${eur(diff)}` : `❌ Não compensa: perdes cerca de ${eur(-diff)}`}</span>
    <button class="btn" ${attr} data-cost="${k.total + price}">🚢 ${label} · ${eurC(k.total + price)}</button>
  </div>`;
}
// Escolher em que cidade compras o carro
function carCitySelect(){
  const here = carAt();
  // Um país por opção: usa a cidade que já estás a ver nesse país, ou a primeira da lista (a capital ou a maior)
  const seen = new Set(), opts = [];
  for(const c of ALL_CITIES) if(!seen.has(c.country)){ seen.add(c.country); opts.push(sameCountry(c.id, here) ? CITY_BY[here] : sameCountry(c.id, S.city) ? CITY_BY[S.city] : c); }
  opts.sort((a,b)=>a.country.localeCompare(b.country,'pt'));
  const cheap = opts.slice().sort((a,b)=>a.car-b.car).slice(0,4).map(c=>c.country).join(', ');
  return `<div class="citybar"><label class="eyebrow" for="carCity">🚗 Comprar carro em</label>
    <select class="search" id="carCity" style="max-width:280px">${opts.map(c=>`<option value="${c.id}" ${sameCountry(c.id, here) ? 'selected' : ''}>${c.flag} ${c.country} · preços ×${nf2.format(c.car)}</option>`).join('')}</select>
    <span class="note">${sameCountry(here, S.city) ? `Estás a comprar no país onde vives.` : `Vives em ${ctry(S.city)}: um carro comprado em ${ctry(here)} tem de ser importado.`} Países mais baratos: ${cheap}.</span></div>`;
}

  const t = VEH_BY[v.id], year = curYear() - Math.floor(Math.max(0, S.day - v.since)/360);
  const k = importCost(t, year, v.cond ?? 3, 1, v.city, dest);
  if(S.cash < k.total){ toast(`A importação custa ${eur(k.total)}.`, 'bad'); return; }
  const from = CITY_BY[v.city]; S.cash -= k.total; v.paid += k.total;
  v.value *= CITY_BY[dest].car/from.car; v.city = dest;
  log(`Importação do ${t.name} de ${from.name} para ${CITY_BY[dest].name}: transporte ${eur(k.transport)}, ${k.taxName} ${eur(k.tax)}, legalização ${eur(k.legal)}`, -k.total);

}
function carBuy(uid, withLoan){ const L = carMk().list.find(x=>x.uid===uid); if(L) carBuyAt(L, L.ask, withLoan); }
function carOffer(uid, f){
  const L = carMk().list.find(x=>x.uid===uid); if(!L || L.offered===S.day) return;
  const price = Math.round(L.ask*(1-f)/50)*50;
  if(S.cash < price){ toast('Não tens dinheiro para cobrir essa proposta.', 'bad'); return; }
  L.offered = S.day;
  const who = L.seller.split(',')[0];
  if(price >= L.min){ toast(`${who} aceitou a tua proposta de ${eur(price)}.`, 'good', '🤝'); carBuyAt(L, price); return; }
  if(Math.random() < 0.5){ L.ask = Math.max(Math.round(L.min/50)*50, Math.round((L.ask+L.min)/2/50)*50); L.note = `${who} recusou ${eur(price)}, mas baixou o preço para ${eur(L.ask)}.`; }
  else L.note = `${who} recusou ${eur(price)}. Podes tentar outra proposta amanhã.`;
  toast(L.note, 'bad', '🙅');
}

function tradeFee(sym, amount){ return A_BY[sym].type==='c' ? amount*0.005 : Math.max(2, amount*0.001); }
function buyAsset(sym, amount){
  amount = Math.min(amount, S.cash);
  if(amount < 10) return;
  const f = tradeFee(sym, amount), q = (amount-f)/price(sym);
  const o = S.hold[sym] || (S.hold[sym] = {q:0, c:0});
  o.q += q; o.c += amount; S.cash -= amount;
  log(`Compra de ${qty(q)} ${sym} a ${eurP(price(sym))}`, -amount);
  toast(`Compraste ${qty(q)} ${A_BY[sym].name}.`, 'good', '📈');
  if(!S.started){ S.started = true; S.speed = 1; }
}
function sellAsset(sym, frac){
  const o = S.hold[sym]; if(!o) return;
  const q = o.q*frac, gross = q*price(sym), f = tradeFee(sym, gross), net = gross - f, cost = o.c*frac;
  S.cash += net; o.q -= q; o.c -= cost;
  if(frac >= 0.999 || o.q*price(sym) < 0.01) delete S.hold[sym];
  S.stats.realized += net - cost;
  log(`Venda de ${qty(q)} ${sym} a ${eurP(price(sym))} (${net-cost>=0?'lucro':'prejuízo'} de ${eur(Math.abs(net-cost))})`, net, net-cost>=0?'':'');
  toast(`Vendeste ${qty(q)} ${A_BY[sym].name}: ${net-cost>=0?'lucro':'prejuízo'} de ${eur(Math.abs(net-cost))}.`, net-cost>=0?'good':'bad', '💶');
}

function marketDay(){
  const m = gauss()*0.009 + (S.market-1)*0.0005;
  const c = gauss()*0.03;
  for(const a of ASSETS){
    const k = S.mk[a.sym], p0 = k.h[k.h.length-1];
    const sd = a.vol/Math.sqrt(365);
    let r;
    if(a.type==='s') r = 0.07/365 + (a.tech?1.3:1)*m + gauss()*sd*0.8;
    else r = 0.1/365 + c*(a.sym==='BTC'?0.8:1) + gauss()*sd*0.7;
    let p = p0*Math.exp(r);
    if(a.meme){ const u = Math.random(); if(u<0.012) p *= 1.5 + Math.random()*2.5; else if(u<0.03) p *= 0.3 + Math.random()*0.3; }
    k.h.push(Math.max(a.meme ? 1e-6 : 0.01, p));
    if(k.h.length > 180) k.h.shift();
  }
}
function shock(filter, mult){
  for(const a of ASSETS) if(filter(a)){ const h = S.mk[a.sym].h; h[h.length-1] *= mult; }
}

function tick(){
  S.day++;
  let inc = 0; for(const id in S.biz) inc += bizDaily(id);
  S.cash += inc; S.monthBiz += inc;
  if(S.cash < 0) S.cash += S.cash*0.18/365;
  marketDay();
  carMarketDay();
  hireDay();
  for(const L of [...S.loans]) if(S.day >= L.due){ processLoan(L); dirty = true; }
  if(S.day % 30 === 0) monthEnd();
  if(S.day % 90 === 0) dividends();
  if(Math.random() < 0.3) dailyNews();
  if(ui.tab==='mercados' || ui.sheet || (ui.tab==='luxo' && ui.luxf!=='carro')) dirty = true;
}

function dividends(){
  let t = 0;
  for(const s in S.hold){ const a = A_BY[s]; if(a.type==='s' && a.div) t += holdValue(s)*a.div/100/4; }
  if(t > 0.5){ S.cash += t; S.stats.div += t; log('Dividendos recebidos', t, 'in'); toast(`Recebeste ${eur(t)} em dividendos.`, 'good', '💰'); }
}

function processLoan(L){
  const p = PROD_BY[L.pid], r = L.rate/1200, interest = L.balance*r;
  const dueAmt = L.left <= 1 ? L.balance + interest : L.pay;
  if(S.cash >= dueAmt){
    S.cash -= dueAmt;
    L.balance = Math.max(0, L.balance + interest - dueAmt);
    L.left--; L.missed = 0;
    S.stats.interest += interest; S.stats.onTime++;
    if(!p.shark) S.score = clamp(S.score+3, 300, 850);
    log(`Prestação · ${p.name} · ${p.bank}`, -dueAmt);
    if(L.left <= 0 || L.balance < 1){
      S.loans = S.loans.filter(l=>l!==L);
      if(!p.shark) S.score = clamp(S.score+12, 300, 850);
      log(`Crédito liquidado: ${p.name} (${p.bank}). Score +12.`, null, 'good evt');
    }
  } else {
    const fee = dueAmt * (p.shark ? 0.25 : 0.1);
    L.balance += interest + fee; L.missed++; S.stats.missed++;
    if(!p.shark) S.score = clamp(S.score-35, 300, 850);
    log(p.shark ? `O Zé das Notas não recebeu. ${eur(fee)} de "taxa de incómodo" somados à dívida.`
                : `Prestação em falta no ${p.bank}. Penalização de ${eur(fee)} e score −35.`, null, 'bad');
    if(L.missed >= (p.shark ? 2 : 3)) defaultLoan(L);
  }
  if(S.loans.includes(L)) L.due += 30;
}

// Todos os ativos que podem ser vendidos ou penhorados
function assetPool(){
  const a = [];
  for(const id in S.biz) a.push({kind:'b', name:BIZ_BY[id].name, v:bizValue(id), forced:0.6, take:()=>{ delete S.biz[id]; if(S.workAt===id) S.workAt = null; }});
  for(const p of S.props) a.push({kind:'p', name:`${pName(p)} (${propPlace(p)})`, v:p.value, forced:0.75, take:()=>{ S.props = S.props.filter(x=>x!==p); }});
  for(const c of S.cars) a.push({kind:'v', name:`${VEH_BY[c.m].name} ${c.year}`, v:carValue(c), forced:0.75, take:()=>{ S.cars = S.cars.filter(x=>x!==c); }});
  for(const v of S.veh) a.push({kind:'v', name:VEH_BY[v.id].name, v:v.value, forced:0.7, take:()=>{ if(drivesThis(v)) S.workAt = null; S.veh = S.veh.filter(x=>x!==v); }});
  for(const s in S.hold) a.push({kind:A_BY[s].type, name:`carteira de ${A_BY[s].name}`, v:holdValue(s), forced:0.95, take:()=>{ delete S.hold[s]; }});
  return a;
}
const LIQUID_FIRST = {s:0, c:0, v:1, b:2, p:3};

function defaultLoan(L){
  const p = PROD_BY[L.pid];
  S.loans = S.loans.filter(l=>l!==L);
  const pool = assetPool();
  if(p.shark){
    pool.sort((a,b)=>b.v-a.v);
    if(pool.length){ pool[0].take(); log(`Os homens do Zé das Notas ficaram com: ${pool[0].name}.`, null, 'bad evt'); }
    else { S.cash -= L.balance; log('O Zé das Notas levou o que havia na conta e mais um pouco.', -L.balance, 'bad evt'); }
    return;
  }
  const order = p.id==='automovel' ? {v:0, s:1, c:1, b:2, p:3} : (p.id==='garantia' || p.id==='habitacao') ? {p:0, s:1, c:1, v:2, b:3} : p.id==='lombard' ? {s:0, c:1, v:2, b:3, p:4} : LIQUID_FIRST;
  pool.sort((a,b)=>(order[a.kind]-order[b.kind]) || (b.v-a.v));
  let owed = L.balance; const seized = [];
  for(const a of pool){ if(owed <= 0) break; a.take(); seized.push(a.name); owed -= a.v*a.forced; }
  if(owed < 0) S.cash += -owed;
  S.score = clamp(S.score-150, 300, 850);
  log(`Incumprimento no ${p.bank}. ${seized.length ? 'Penhorado: ' + seized.join(', ') + '.' : 'Nada para penhorar.'} Score −150.`, null, 'bad evt');
}

function liquidate(){
  const pool = assetPool().sort((a,b)=>(LIQUID_FIRST[a.kind]-LIQUID_FIRST[b.kind]) || (a.v-b.v));
  for(const a of pool){
    if(S.cash >= 0) break;
    a.take(); S.cash += a.v*a.forced;
    log(`Venda forçada: ${a.name}`, a.v*a.forced, 'bad');
  }
}

function setBoost(sector, mult, days){ S.boosts[sector] = {mult, until:S.day+days}; }

function monthEnd(){
  if(S.monthBiz > 0) log('Faturação dos negócios', S.monthBiz, 'in');
  S.monthBiz = 0;
  if(salaryNow() > 0){ S.cash += salaryNow(); log(`Salário (${CITY_BY[S.city].name})`, salaryNow(), 'in'); }
  const sc = staffCost(); if(sc > 0){ S.cash -= sc; log('Salários e Segurança Social dos funcionários', -sc); }
  for(const id in S.biz){
    const o = S.biz[id], b = BIZ_BY[id];
    if(S.workAt===id) o.oxp = (o.oxp||0) + 1;
    for(const e of [...o.staff]){
      e.xp = (e.xp||0) + 1;
      // Aumento por antiguidade: +3% a cada ano de casa
      const m = monthsIn(e);
      if(m > 0 && m % 12 === 0 && e.lastSen !== m){ e.lastSen = m; const before = e.sal; e.sal = wage(e.sal*1.03); log(`${e.name} faz ${m/12} ${m===12 ? 'ano' : 'anos'} no ${BIZ_BY[id].name}: aumento por antiguidade de ${eur(before)} para ${eur(e.sal)}.`); }
      // Fim de contrato a termo: não renovar, renovar (até 3 contratos) ou passa a efetivo
      if(e.contract==='termo' && S.day >= e.end){
        if(e.noRenew){ const c = endCost(e); o.staff = o.staff.filter(x=>x!==e); S.cash -= c; log(`O contrato de ${e.name} no ${BIZ_BY[id].name} terminou. Compensação de fim de contrato.`, -c, 'bad'); continue; }
        if((e.renew||0) < 2){ e.renew = (e.renew||0) + 1; e.end = S.day + (e.months||12)*30; log(`Contrato de ${e.name} renovado por mais ${e.months||12} meses (renovação ${e.renew} de 2).`); }
        else { e.contract = 'efetivo'; e.end = null; log(`${e.name} passou a efetivo no ${BIZ_BY[id].name}: chegou ao limite de renovações do contrato a termo.`, null, 'good evt'); }
      }
      // Com a experiência, sobem de nível (mais produtividade) e pedem aumento
      if(e.skill < 5 && e.xp >= 6 && Math.random() < 1/(6 + 6*e.skill)){
        e.skill++; e.xp = 0;
        const fair = wage(ROLES[b.role].s*salIdx(o.city)*SKILL[e.skill].s);
        if(fair > e.sal){ e.raise = fair; e.raiseSince = S.day; }
        log(`${e.name} ganhou experiência no ${BIZ_BY[id].name}: agora ${e.skill} estrelas (produtividade ${pct(SKILL[e.skill].p*100,0)}).${e.raise ? ` Pede aumento para ${eur(e.raise)}.` : ''}`, null, 'good evt');
      }
      const quit = e.raise && S.day - e.raiseSince > 45 ? 0.2 : e.refused ? 0.06*e.refused : e.contract==='termo' ? 0.025 : 0.01;
      if(Math.random() < quit){
        o.staff = o.staff.filter(x=>x!==e);
        log(`${e.name} saiu do ${BIZ_BY[id].name}: ${e.raise || e.refused ? 'foi para a concorrência por um salário melhor' : 'recebeu uma proposta melhor'}. Contrata alguém para a vaga.`, null, 'bad');
      }
    }
  }
  carsMonth();
  const rents = rentsMonthly(); if(rents>0){ S.cash += rents; log('Rendas recebidas', rents, 'in'); }
  S.cash -= baseLiving(); log(`Custo de vida em ${CITY_BY[S.city].name} (comida, transportes, contas)`, -baseLiving());
  const home = homeProp(), hc = housingCost();
  S.cash -= hc; log(home ? `Manutenção da casa (${pName(home)})` : 'Renda do quarto onde vives', -hc);
  if(S.veh.length){
    const up = vehUpkeep(), ea = vehEarn();
    S.cash -= up; log('Seguros, manutenção, marina e hangar', -up);
    if(ea > 0){ S.cash += ea; log('Rendimento de TVDE, charter e alugueres', ea, 'in'); }
    S.veh.forEach(v=>{ const t = VEH_BY[v.id]; v.value *= 1 - t.dep*(v.mode==='render' && t.dep>0 ? 1.6 : 1)/12; });
  }
  if(S.day % 360 === 0 && S.props.length){ const imi = propTotal()*0.003; S.cash -= imi; log('IMI anual (0,3% do valor patrimonial)', -imi); }

  S.euribor = clamp(S.euribor + gauss()*0.12 + (2.5-S.euribor)*0.02, 0, 6);
  if(Math.random() < 0.5) news(`Euribor a 12 meses fixa-se em ${pct(S.euribor,3)}`, '');
  S.market = clamp(S.market + (1-S.market)*0.08 + gauss()*0.025, 0.6, 1.45);
  const h0 = S.housing; S.housing *= 1 + 0.0025 + gauss()*0.012;
  const ch = S.housing/h0; S.props.forEach(p=>p.value *= ch*(1+gauss()*0.006));
  for(const k in S.boosts) if(S.boosts[k].until <= S.day) delete S.boosts[k];

  if(Math.random() < 0.4){
    const pool = EVENTS.filter(e=>!e.cond || e.cond());
    let r = Math.random()*pool.reduce((t,e)=>t+e.w,0);
    for(const e of pool){ r -= e.w; if(r<=0){ const [t,k,a] = e.run(); const mine = !!e.cond || /Herança/.test(t); if(mine) log(t, a ?? null, k+' evt'); else { log(t, a ?? null, k+' news'); news(t, k); } break; } }
  }

  if(S.cash < 0){
    S.score = clamp(S.score-8, 300, 850);
    log('Conta a descoberto: juros de 18% ao ano e score −8.', null, 'bad');
    const lim = 2000 + monthlyIncome()*0.5;
    if(S.cash < -lim){
      liquidate();
      if(S.cash < -lim){ S.over = 'insolvencia'; S.speed = 0; S.log.unshift({d:S.day, t:'Declarada insolvência.', a:null, k:'bad evt'}); }
    }
  }

  const nw = netWorth();
  S.hist.push({d:S.day, nw});
  if(S.hist.length > 600) S.hist = S.hist.filter((_,i)=>i%2===0 || i===S.hist.length-1);
  S.stats.peak = Math.max(S.stats.peak, nw);
  const ti = titleIdx(nw);
  if(ti > S.title){ S.title = ti; log(`Novo estatuto: ${TITLES[ti].name}!`, null, 'good evt'); if(ti >= 4) news(`Novo ${TITLES[ti].name.toLowerCase()} em ${CITY_BY[S.city].name}: investidor que começou com crédito passa os ${eurC(TITLES[ti].nw)} de património`, 'good'); }
  if(nw >= 1e9 && !S.won){ S.won = true; S.speed = 0; }
  save();
  dirty = true;
}

/* =========================================================
   GRÁFICO DE LINHA (canvas com cursor)
   ========================================================= */
function lineChart(cv, pts, o){
  const wrap = cv.parentElement, tip = wrap.querySelector('.tip');
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  if(!W) return;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d');
  const cs = getComputedStyle(document.documentElement), col = n=>cs.getPropertyValue(n).trim();
  const L = o.left || 64, R = 12, T = 12, B = 24, w = W-L-R, h = H-T-B;
  let min = Math.min(o.zero?0:Infinity, ...pts.map(p=>p.v)), max = Math.max(...pts.map(p=>p.v));
  if(max===min){ max = min + (Math.abs(min)||1); }
  const span = max-min, step = Math.pow(10, Math.floor(Math.log10(span/4))), m = span/4/step;
  const nice = (m<=1?1:m<=2?2:m<=5?5:10)*step;
  min = Math.floor(min/nice)*nice; max = Math.ceil(max/nice)*nice;
  const n = pts.length;
  const X = i=>L + (n>1 ? i/(n-1) : 1)*w, Y = v=>T + (1-(v-min)/(max-min))*h;
  const line = o.color ? col(o.color) : col('--brand');
  function draw(hi){
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
    g.font = `11px ${col('--mono')}`; g.textBaseline = 'middle';
    for(let v=min; v<=max+nice/2; v+=nice){
      g.strokeStyle = col('--line'); g.lineWidth = 1; g.beginPath(); g.moveTo(L, Math.round(Y(v))+.5); g.lineTo(W-R, Math.round(Y(v))+.5); g.stroke();
      g.fillStyle = col('--muted'); g.textAlign = 'right'; g.fillText(o.axis(v), L-8, Y(v));
    }
    g.textBaseline = 'alphabetic'; g.fillStyle = col('--muted');
    g.textAlign = 'left'; g.fillText(pts[0].t, L, H-6); g.textAlign = 'right'; g.fillText(pts[n-1].t, W-R, H-6);
    if(min < 0 && max > 0){ g.strokeStyle = col('--muted'); g.setLineDash([3,3]); g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-R,Y(0)); g.stroke(); g.setLineDash([]); }
    const base = Y(clamp(0,min,max));
    g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(X(i),Y(p.v)) : g.moveTo(X(i),Y(p.v)));
    g.lineTo(X(n-1), o.zero ? base : T+h); g.lineTo(X(0), o.zero ? base : T+h); g.closePath();
    g.globalAlpha = .14; g.fillStyle = line; g.fill(); g.globalAlpha = 1;
    g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(X(i),Y(p.v)) : g.moveTo(X(i),Y(p.v)));
    g.strokeStyle = line; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke();
    const e = hi ?? n-1;
    if(hi != null){ g.strokeStyle = col('--muted'); g.lineWidth = 1; g.beginPath(); g.moveTo(Math.round(X(e))+.5, T); g.lineTo(Math.round(X(e))+.5, T+h); g.stroke(); }
    g.fillStyle = col('--surface'); g.beginPath(); g.arc(X(e),Y(pts[e].v),6,0,Math.PI*2); g.fill();
    g.fillStyle = col('--accent'); g.beginPath(); g.arc(X(e),Y(pts[e].v),4.5,0,Math.PI*2); g.fill();
    if(hi != null){
      tip.hidden = false;
      tip.innerHTML = `<span class="muted"></span><strong class="num"></strong>`;
      tip.firstChild.textContent = pts[e].t; tip.lastChild.textContent = o.fmt(pts[e].v);
      tip.style.left = clamp(X(e), 70, W-70) + 'px'; tip.style.top = Y(pts[e].v) + 'px';
    } else tip.hidden = true;
  }
  draw(null);
  cv.onpointermove = ev=>{ const r = cv.getBoundingClientRect(); const i = Math.round((ev.clientX-r.left-L)/w*(n-1)); draw(clamp(i,0,n-1)); };
  cv.onpointerleave = ()=>draw(null);
}

function realTime(days){

  const sec = days/(S.speed*DAY_RATE);
  return sec >= 3600 ? ` (≈ ${nf1.format(sec/3600)} h)` : sec >= 60 ? ` (≈ ${Math.round(sec/60)} min)` : ` (≈ ${Math.max(1,Math.round(sec))} s)`;
}

  if(S.cash < 0) return {alert:true, ico:'🚨', t:'A tua conta está a descoberto', d:'Pagas 18% de juros ao ano e o score desce todos os meses. Vende um ativo para voltar a positivo.', go:'negocios', b:'Ver ativos'};
  const closed = Object.keys(S.biz).find(id=>staffRatio(id)===0);
  if(closed) return {alert:true, ico:'👥', t:`O ${bizLabel(closed)} está fechado`, d:`Não tem ninguém a trabalhar. Contrata ${ROLES[BIZ_BY[closed].role].n.toLowerCase()} no Recrutamento, ou trabalha lá tu (só podes trabalhar num negócio).`, go:'negocios', b:'Ver negócios'};

  if(!anyInv) return {ico:'🍦', t:'Passo 2: põe o dinheiro a render', d:`Tens ${eur(S.cash)}. Compra um negócio que fature mais por mês do que a prestação do crédito, ou vai a Garagem › Usados, compra um carro barato e revende-o com lucro.`, go:'negocios', b:'Ver negócios'};

function vBanco(){
  const inc = monthlyIncome(), ds = debtService(), esf = inc>0 ? ds/inc : 0;
  const offers = PRODUCTS.map(p=>{
    if(p.linked) return `<button class="offer" data-tab="${p.go}"${p.go==='luxo' ? ' data-luxf="carro"' : ''}>

      <h3>${p.name}</h3>
      <span class="tan">${pct(p.rate())}<small>TAN</small></span>
      <span class="note">${p.blurb} ${p.go==='luxo' ? 'Escolhe o carro na Garagem →' : 'Escolhe a casa em Imóveis →'}</span>
    </button>`;
    const reason = prodReason(p), max = maxFor(p, p.terms[p.terms.length-1]);
    const status = reason ? `<span class="chip">🔒 Bloqueado</span>` : max<500 ? `<span class="chip warn">Sem margem</span>` : `<span class="chip pos">Até ${eurC(max)}</span>`;
    return `<button class="offer ${p.shark?'shark':''} ${reason?'off':''}" data-sel="${p.id}" aria-pressed="${ui.sel===p.id}">
      <span class="row" style="align-items:center"><span style="display:flex;gap:8px;align-items:center"><span class="bank-logo" style="background:${p.col}">${p.logo}</span><span class="eyebrow">${p.bank}</span></span>${status}</span>
      <h3>${p.name}</h3>
      <span class="tan">${pct(p.rate())}<small>TAN</small></span>
      <span class="note">${reason || p.blurb}</span>
    </button>`;
  }).join('');
  const loans = S.loans.length ? `<div class="loans">${S.loans.map(L=>{ const p = PROD_BY[L.pid], total = L.balance*(p.shark?1:1.005), paid = 1 - L.balance/L.principal;
      return `<article class="loan ${L.missed?'late':''}">
        <div class="row" style="align-items:center"><span style="display:flex;gap:8px;align-items:center"><span class="bank-logo" style="background:${p.col}">${p.logo}</span><span><strong>${p.name}</strong><br><span class="note">${p.bank} · desde ${dateOf(L.start)}</span></span></span>
          ${L.missed ? `<span class="chip neg">${L.missed} em atraso</span>` : '<span class="chip pos">Em dia</span>'}</div>
        <div><div class="row note"><span>Pago ${pct(clamp(paid,0,1)*100,0)}</span><span>Faltam ${L.left} prestações</span></div><div class="bar"><span style="width:${(clamp(paid,0,1)*100).toFixed(1)}%"></span></div></div>
        <dl class="kv"><dt>Em dívida</dt><dd>${eurC(L.balance)}</dd><dt>Prestação</dt><dd>${eur(L.pay)}</dd><dt>TAN</dt><dd>${pct(L.rate)}</dd><dt>Próximo débito</dt><dd>${dateOf(L.due)}</dd></dl>
        ${amortBox(L)}
        <button class="btn" data-payoff="${L.uid}" data-cost="${total}">Liquidar tudo · ${eurC(total)}</button>
      </article>`;}).join('')}</div>`
    : `<div class="empty">Ainda não tens créditos. Escolhe uma oferta acima.</div>`;
  return `<div class="stack">
    <section class="card">
      <div class="card-head"><h2>A tua ficha no Banco de Portugal</h2><span class="note">Central de Responsabilidades de Crédito</span></div>
      <div class="metrics">
        <div><div class="eyebrow">Rendimento mensal</div><div class="big-n">${eurC(inc)}</div></div>
        <div><div class="eyebrow">Prestações mensais</div><div class="big-n">${eurC(ds)}</div></div>
        <div><div class="eyebrow">Taxa de esforço ${help('esforco')}</div><div class="big-n ${esf>0.6?'neg':''}">${pct(esf*100,1)}</div>
          <div class="bar" style="margin-top:6px"><span style="width:${Math.min(100,esf/0.6*100).toFixed(1)}%;background:var(--${esf>0.5?'neg':esf>0.4?'warn':'pos'})"></span></div></div>
        <div><div class="eyebrow">Score ${help('score')}</div><div class="big-n">${Math.round(S.score)}</div></div>
      </div>
    </section>
    <div class="g-bank">
      <div class="offers">${offers}</div>
      ${vSim()}
    </div>
    <section class="card"><div class="card-head"><h2>Os teus créditos</h2><span class="note">Liquidar antes do prazo nos bancos custa 0,5% de comissão</span></div>${loans}</section>
  </div>`;
}
function amortBox(L){
  const a = Math.min(+(ui.amort[L.uid] ?? Math.round(L.balance*0.1/100)*100) || 0, L.balance), mode = ui.amortMode[L.uid] || 'pay';
  const res = amortResult(L, a, mode), fee = a*amortFee(L);
  const quick = [[0.1,'10%'],[0.25,'25%'],[0.5,'50%']].map(([f,l])=>[Math.round(L.balance*f/100)*100, l]);
  const maxCash = Math.floor(Math.min(L.balance, Math.max(0, S.cash)/(1+amortFee(L)))/100)*100;
  return `<div style="border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px">
    <label class="eyebrow" for="am-${L.uid}">Amortizar parte da dívida</label>
    <div class="amount" style="display:flex;gap:8px;align-items:center"><input id="am-${L.uid}" type="number" min="100" step="100" max="${Math.round(L.balance)}" value="${Math.round(a)}" inputmode="numeric" style="flex:1;min-width:0;font:600 18px var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"><span class="muted">€</span></div>
    <div class="quick">${quick.map(([v,l])=>`<button data-amset="${L.uid}|${v}">${l} · ${eurC(v)}</button>`).join('')}${maxCash >= 100 ? `<button data-amset="${L.uid}|${maxCash}">Tudo o que tenho · ${eurC(maxCash)}</button>` : ''}</div>
    <div class="seg" role="group" aria-label="Efeito da amortização"><button data-ammode="${L.uid}|pay" aria-pressed="${mode==='pay'}">Baixar a prestação</button><button data-ammode="${L.uid}|term" aria-pressed="${mode==='term'}">Encurtar o prazo</button></div>
    <p class="note">${a < 100 ? 'Mínimo de 100 €.' : res.bal < 1 ? 'Com este valor liquidas o crédito todo.' : mode==='term' ? `Fica a dever ${eur(res.bal)}. Mantém a prestação de ${eur(res.pay)} e acaba ${L.left - res.left} meses mais cedo (${res.left} em vez de ${L.left}).` : `Fica a dever ${eur(res.bal)}. A prestação passa de ${eur(L.pay)} para ${eur(res.pay)}.`}${fee ? ` Comissão de ${pct(amortFee(L)*100,1)}: ${eur(fee)}.` : ''}</p>
    <button class="btn primary" data-amort="${L.uid}" data-cost="${a*(1+amortFee(L))}" ${a < 100 ? 'disabled' : ''}>Amortizar ${eur(a)}</button>
  </div>`;
}
function vSim(){
  const p = PROD_BY[ui.sel];
  if(!p.terms.includes(ui.term)) ui.term = p.terms[Math.min(1,p.terms.length-1)];
  const max = maxFor(p, ui.term), reason = prodReason(p);
  const stamp = ui.stamp ? `<div class="stamp ${ui.stamp.ok?'ok':'no'}">${ui.stamp.ok?'Aprovado':'Recusado'}<small>${ui.stamp.sub}</small></div>` : '';
  return `<section class="card sim" aria-live="polite">
    ${stamp}
    <div style="display:flex;gap:10px;align-items:center"><span class="bank-logo" style="background:${p.col};width:40px;height:40px">${p.logo}</span><div><div class="eyebrow">${p.bank}</div><h2>${p.name}</h2></div></div>
    <label for="amt" class="eyebrow">Quanto queres pedir?</label>
    <div class="amount"><input id="amt" type="number" min="500" step="100" value="${Math.round(ui.amount)}" inputmode="numeric"><span class="muted">€</span></div>
    <div class="quick">${[1000,5000,20000].filter(v=>v<=max).map(v=>`<button data-amt="${v}">${eur(v)}</button>`).join('')}${max>=500?`<button data-amt="${max}">Máximo · ${eurC(max)}</button>`:''}</div>
    <input id="amtR" type="range" min="500" max="${Math.max(500,max)}" step="100" value="${clamp(ui.amount,500,Math.max(500,max))}" aria-label="Montante" ${max<500?'disabled':''}>
    <div><div class="eyebrow" style="margin-bottom:6px">Durante quanto tempo?</div>
      <div class="terms">${p.terms.map(t=>`<button data-term="${t}" aria-pressed="${ui.term===t}">${t<24?t+' meses':(t/12)+' anos'}</button>`).join('')}</div></div>
    <div class="bigpay"><span>Prestação mensal</span><span class="num" id="simPay"></span></div>
    <p class="plain" id="simPlain"></p>
    <dl class="kv">
      <dt>TAN (taxa fixa) ${help('tan')}</dt><dd>${pct(p.rate())}</dd>
      <dt>Total de juros</dt><dd id="simInt"></dd>
      <dt>MTIC ${help('mtic')}</dt><dd id="simMtic"></dd>
      ${p.shark ? '' : `<dt>Taxa de esforço depois ${help('esforco')}</dt><dd id="simEsf"></dd>`}
    </dl>
    ${p.shark ? '<div class="warnbox">O Zé não quer saber do teu score, mas também não perdoa. Duas prestações falhadas e fica com o teu ativo mais valioso.</div>' : ''}
    ${reason ? `<div class="warnbox">🔒 ${reason}</div>` : ''}
    <button class="btn primary big" id="contract">Assinar contrato</button>
  </section>`;
}
function updateSim(){
  const p = PROD_BY[ui.sel]; if(!$('simPay')) return;
  const a = Math.max(0, +ui.amount||0), pay = pmt(a, p.rate(), ui.term), max = maxFor(p, ui.term);
  $('simPay').textContent = eur(pay);
  $('simInt').textContent = eur(pay*ui.term - a);
  $('simMtic').textContent = eur(pay*ui.term);
  $('simPlain').textContent = a > max && max >= 500 ? `O máximo que te emprestam a ${ui.term} meses é ${eur(max)}. Baixa o montante ou escolhe um prazo mais longo.`
    : `Recebes ${eur(a)} hoje e pagas ${eur(pay)} por mês durante ${ui.term} meses. No fim terás pago ${eur(pay*ui.term)}.`;
  if($('simEsf')){ const inc = monthlyIncome(); const e = (debtService()+pay)/inc; const el = $('simEsf'); el.textContent = pct(e*100,1); el.className = e>0.6?'neg':''; }
  $('contract').disabled = !!prodReason(p) || a < 500 || a > max;
}
